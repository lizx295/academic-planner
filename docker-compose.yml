# Entorno local completo: PostgreSQL + la app Next.js (PWA).
#
# Uso:
#   docker compose up --build
#   open http://localhost:3000
#
# Las claves de abajo son solo para desarrollo. En producción (Vercel +
# Supabase) define valores propios en las variables de entorno del proyecto.

name: academic-planner

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: planner
      POSTGRES_PASSWORD: planner
      POSTGRES_DB: academic_planner
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planner -d academic_planner"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      TZ: America/Guayaquil
      DATABASE_URL: postgres://planner:planner@db:5432/academic_planner
      DATABASE_SSL: disable
      AUTH_SECRET: ${AUTH_SECRET:-dev-cambia-esta-clave-larga-academic-planner}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-dev-cambia-esta-clave-de-cifrado-32bytes}
      ALLOWED_EMAIL_DOMAINS: ${ALLOWED_EMAIL_DOMAINS:-espol.edu.ec}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@espol.edu.ec}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-AdminEspol2026!}
      DEMO_EMAIL: ${DEMO_EMAIL:-demo@espol.edu.ec}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-Demo-2026}
      SEED_DEMO: ${SEED_DEMO:-true}
      AULAVIRTUAL_BASE_URL: ${AULAVIRTUAL_BASE_URL:-https://aulavirtual.espol.edu.ec}
      CRON_SECRET: ${CRON_SECRET:-dev-cron-secret}
      # Web Push: si no se definen, el servidor genera claves efímeras.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:soporte@espol.edu.ec}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
