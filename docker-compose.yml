name: academic-planner

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: planner
      POSTGRES_PASSWORD: planner
      POSTGRES_DB: academic_planner
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planner -d academic_planner"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      TZ: America/Guayaquil
      AP_ENVIRONMENT: development
      AP_DATABASE_URL: postgresql+psycopg://planner:planner@db:5432/academic_planner
      AP_CORS_ORIGINS: '["http://localhost:3000","http://127.0.0.1:3000"]'
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: .
    restart: unless-stopped
    environment:
      TZ: America/Guayaquil
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata: